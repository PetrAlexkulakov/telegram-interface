<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!--
    Бесшовная плитка фона чата: дудлы в духе Telegram.
    Каждая иконка нарисована в клетке 24x24 и раскладывается через <use>,
    все фигуры целиком помещаются внутри плитки, поэтому стык не виден.
  -->
  <defs>
    <g id="heart">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </g>

    <g id="star">
      <path d="M12 2.4l3.03 6.14 6.77.98-4.9 4.78 1.16 6.75L12 17.86l-6.06 3.19L7.1 14.3 2.2 9.52l6.77-.98L12 2.4z"/>
    </g>

    <g id="plane">
      <path d="M2.5 20.5l19-8.5-19-8.5V10l13 2-13 2v6.5z"/>
    </g>

    <g id="cup">
      <path d="M3.5 4.5h13v5.8a5.2 5.2 0 0 1-5.2 5.2H8.7a5.2 5.2 0 0 1-5.2-5.2V4.5z"/>
      <path d="M16.8 6.4h2.1a2.6 2.6 0 0 1 0 5.2h-2.1" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M2.4 18.6h15.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <g id="smiley">
      <circle cx="12" cy="12" r="9.6" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <circle cx="8.6" cy="10" r="1.45"/>
      <circle cx="15.4" cy="10" r="1.45"/>
      <path d="M7.4 14.4c1.2 1.9 2.9 2.9 4.6 2.9s3.4-1 4.6-2.9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </g>

    <g id="music">
      <path d="M9.2 17.4V6.2l9.4-2v11.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
      <circle cx="6.9" cy="17.6" r="2.7"/>
      <circle cx="16.3" cy="15.6" r="2.7"/>
    </g>

    <g id="cloud">
      <path d="M6.2 18.4a4.3 4.3 0 0 1 .3-8.6 5.8 5.8 0 0 1 11-1.6 3.95 3.95 0 0 1-.6 10.2H6.2z"/>
    </g>

    <g id="bolt">
      <path d="M13.4 2L4.6 14.2h5.6L8.9 22l9.1-12.4h-5.7L13.4 2z"/>
    </g>

    <g id="cat">
      <!-- Глаза — вырезы в силуэте (evenodd), иначе при общей прозрачности они бы пропали. -->
      <path fill-rule="evenodd" d="M5.2 9.6l.9-5.4 4.1 2.9h3.6l4.1-2.9.9 5.4v3.8a6.3 6.3 0 0 1-6.3 6.3h-1a6.3 6.3 0 0 1-6.3-6.3V9.6zM9.5 10.25a1.15 1.15 0 1 0 .01 2.3 1.15 1.15 0 0 0-.01-2.3zM14.5 10.25a1.15 1.15 0 1 0 .01 2.3 1.15 1.15 0 0 0-.01-2.3z"/>
    </g>

    <g id="gift">
      <path fill-rule="evenodd" d="M3.6 10.4h16.8v9.2H3.6zM2.6 6.2h18.8v3.6H2.6zM11.15 6.2h1.7v13.4h-1.7z"/>
      <path d="M12 6.2c-1.6-3.8-6.4-3.4-6.4-.6 0 .3.1.4.2.6M12 6.2c1.6-3.8 6.4-3.4 6.4-.6 0 .3-.1.4-.2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </g>

    <g id="moon">
      <path d="M20.8 14.1A8.9 8.9 0 1 1 10.4 3.4a7 7 0 0 0 10.4 10.7z"/>
    </g>

    <g id="balloon">
      <ellipse cx="12" cy="9.2" rx="5.8" ry="7"/>
      <path d="M12 16.2v1.6M12 17.8c-1.6 1-1.6 3 0 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </g>
  </defs>

  <g fill="#5d7c96" stroke="none" color="#5d7c96" opacity="0.15">
    <use href="#bolt"     transform="translate(34,44) rotate(-17) scale(1.44) translate(-12,-12)"/>
    <use href="#heart"    transform="translate(122,46) rotate(-24) scale(1.34) translate(-12,-12)"/>
    <use href="#smiley"   transform="translate(206,43) rotate(19) scale(1.27) translate(-12,-12)"/>
    <use href="#moon"     transform="translate(280,49) rotate(25) scale(1.2) translate(-12,-12)"/>
    <use href="#balloon"  transform="translate(353,38) rotate(-14) scale(1.36) translate(-12,-12)"/>
    <use href="#cat"      transform="translate(442,31) rotate(-24) scale(1.41) translate(-12,-12)"/>
    <use href="#star"     transform="translate(80,122) rotate(-7) scale(1.39) translate(-12,-12)"/>
    <use href="#plane"    transform="translate(160,106) rotate(-23) scale(1.23) translate(-12,-12)"/>
    <use href="#music"    transform="translate(252,106) rotate(20) scale(1.41) translate(-12,-12)"/>
    <use href="#cloud"    transform="translate(308,126) rotate(4) scale(1.41) translate(-12,-12)"/>
    <use href="#cup"      transform="translate(387,111) rotate(-21) scale(1.31) translate(-12,-12)"/>
    <use href="#gift"     transform="translate(33,211) rotate(-7) scale(1.37) translate(-12,-12)"/>
    <use href="#balloon"  transform="translate(130,205) rotate(-24) scale(1.36) translate(-12,-12)"/>
    <use href="#cat"      transform="translate(211,205) rotate(-22) scale(1.26) translate(-12,-12)"/>
    <use href="#smiley"   transform="translate(281,203) rotate(22) scale(1.16) translate(-12,-12)"/>
    <use href="#gift"     transform="translate(365,200) rotate(13) scale(1.22) translate(-12,-12)"/>
    <use href="#music"    transform="translate(439,208) rotate(-14) scale(1.27) translate(-12,-12)"/>
    <use href="#cloud"    transform="translate(72,269) rotate(-4) scale(1.16) translate(-12,-12)"/>
    <use href="#moon"     transform="translate(152,271) rotate(22) scale(1.24) translate(-12,-12)"/>
    <use href="#bolt"     transform="translate(246,271) rotate(1) scale(1.31) translate(-12,-12)"/>
    <use href="#cup"      transform="translate(333,291) rotate(8) scale(1.37) translate(-12,-12)"/>
    <use href="#heart"    transform="translate(412,294) rotate(8) scale(1.35) translate(-12,-12)"/>
    <use href="#star"     transform="translate(43,364) rotate(18) scale(1.1) translate(-12,-12)"/>
    <use href="#plane"    transform="translate(125,361) rotate(-20) scale(1.14) translate(-12,-12)"/>
    <use href="#cat"      transform="translate(213,350) rotate(-10) scale(1.12) translate(-12,-12)"/>
    <use href="#heart"    transform="translate(291,354) rotate(12) scale(1.1) translate(-12,-12)"/>
    <use href="#smiley"   transform="translate(361,352) rotate(4) scale(1.33) translate(-12,-12)"/>
    <use href="#balloon"  transform="translate(437,352) rotate(-18) scale(1.2) translate(-12,-12)"/>
    <use href="#bolt"     transform="translate(80,431) rotate(-21) scale(1.28) translate(-12,-12)"/>
    <use href="#music"    transform="translate(158,430) rotate(-22) scale(1.28) translate(-12,-12)"/>
    <use href="#gift"     transform="translate(243,430) rotate(1) scale(1.11) translate(-12,-12)"/>
    <use href="#cup"      transform="translate(331,447) rotate(-9) scale(1.13) translate(-12,-12)"/>
    <use href="#cloud"    transform="translate(414,427) rotate(25) scale(1.41) translate(-12,-12)"/>
  </g>
</svg>
